<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1a1a4e"/>
      <stop offset="100%" stop-color="#05050f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>

  <!-- Stars -->
  <circle cx="60"  cy="55"  r="2.5" fill="#fff" opacity="0.7"/>
  <circle cx="130" cy="30"  r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="390" cy="60"  r="2"   fill="#fff" opacity="0.8"/>
  <circle cx="460" cy="130" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="70"  cy="380" r="2"   fill="#fff" opacity="0.6"/>
  <circle cx="440" cy="420" r="2.5" fill="#fff" opacity="0.5"/>
  <circle cx="200" cy="45"  r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="340" cy="470" r="1.5" fill="#fff" opacity="0.4"/>

  <!-- Rocket body -->
  <path d="M256 110 C282 155 294 205 294 265 L256 285 L218 265 C218 205 230 155 256 110Z" fill="#c7d2fe"/>
  <!-- Rocket nose tip -->
  <path d="M256 75 L284 135 L256 110 L228 135Z" fill="#818cf8"/>
  <!-- Rocket window -->
  <circle cx="256" cy="215" r="24" fill="#1e1b4b" stroke="#818cf8" stroke-width="3.5"/>
  <circle cx="256" cy="215" r="15" fill="#4338ca" opacity="0.85"/>
  <circle cx="248" cy="207" r="5"  fill="#fff"    opacity="0.35"/>
  <!-- Rocket fins -->
  <path d="M218 265 L185 310 L218 296Z" fill="#6366f1"/>
  <path d="M294 265 L327 310 L294 296Z" fill="#6366f1"/>
  <!-- Flame outer -->
  <ellipse cx="256" cy="300" rx="20" ry="14" fill="#f59e0b" opacity="0.95"/>
  <!-- Flame mid -->
  <ellipse cx="256" cy="316" rx="13" ry="22" fill="#ef4444" opacity="0.75"/>
  <!-- Flame inner -->
  <ellipse cx="256" cy="326" rx="7"  ry="14" fill="#fde047" opacity="0.95"/>

  <!-- Text -->
  <text x="256" y="395" font-family="'Arial Black',Arial,sans-serif" font-size="50" font-weight="900"
        fill="#c7d2fe" text-anchor="middle" letter-spacing="-1">미니게임</text>
  <text x="256" y="458" font-family="'Arial Black',Arial,sans-serif" font-size="42" font-weight="900"
        fill="#818cf8" text-anchor="middle" letter-spacing="2">천  국</text>
</svg>
